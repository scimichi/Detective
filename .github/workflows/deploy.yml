name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # So the board can be seen live before anything is merged.
      - 'claude/**'
  workflow_dispatch:

# The deploy job needs to mint an ID token for the Pages deployment and write
# to the Pages environment; nothing else needs any write access at all.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish so a
# half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project page lives under /<repo>/. Reading it from the event
          # keeps the path right if the repository is ever renamed or forked.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
