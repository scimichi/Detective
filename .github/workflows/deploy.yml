name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # So the board can be seen live before anything is merged.
      - 'claude/**'
  workflow_dispatch:
    inputs:
      render_narration:
        description: 'Re-render narration (COSTS MONEY — only when the script or voice changed)'
        type: boolean
        default: false

# The deploy job needs to mint an ID token for the Pages deployment and write
# to the Pages environment; nothing else needs any write access at all.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish so a
# half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rendered narration is expensive to produce and never changes unless a
      # script does, so it is cached by content. A redeploy that touches no
      # narration re-bills nothing.
      #
      # The run id in the key is load-bearing, and its absence was a real bug
      # that billed the whole archive on every single deploy.
      #
      # Cache entries on GitHub are immutable: a run that *hits* its primary
      # key will not save, because there is already something under that name.
      # The first deploy after the key was configured ran without credit and
      # stored the only thing it had — an empty manifest, 331 bytes. Every
      # deploy after that restored those 331 bytes, re-rendered all 341 clips,
      # then declined to save the result because the key was taken. It would
      # have done that forever.
      #
      # A key that is unique per run can always be written; the restore-keys
      # below then find the newest previous one by prefix. This is the standard
      # shape for a cache that accumulates rather than one keyed to an exact
      # input.
      - name: Restore rendered narration
        uses: actions/cache/restore@v4
        with:
          path: public/narration
          key: narration-${{ hashFiles('src/data/tours.js') }}-${{ vars.NARRATION_VOICE }}-
          restore-keys: |
            narration-${{ hashFiles('src/data/tours.js') }}-${{ vars.NARRATION_VOICE }}-
            narration-${{ hashFiles('src/data/tours.js') }}-

      # Rendering calls a paid API, and a deploy is not a request to spend
      # money. Every ordinary push takes the clips from the cache and costs
      # nothing; this step only runs when somebody has actually asked for it,
      # either by ticking the box on a manual run or by setting the repository
      # variable while a batch of script changes is being worked through.
      #
      # Kept as continue-on-error regardless: the board works without recorded
      # narration — every phrase without a clip falls back to the browser voice
      # on its own — so an outage or an exhausted quota should cost the voice
      # and nothing more.
      - name: Render narration
        if: github.event.inputs.render_narration == 'true' || vars.NARRATION_RENDER == '1'
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          NARRATION_VOICE: ${{ vars.NARRATION_VOICE }}
        run: node scripts/render-narration.mjs

      # Only after a render that actually happened. A save on every deploy
      # would pile up a fresh copy of fifteen megabytes per push for no reason.
      - name: Save rendered narration
        if: github.event.inputs.render_narration == 'true' || vars.NARRATION_RENDER == '1'
        uses: actions/cache/save@v4
        with:
          path: public/narration
          key: narration-${{ hashFiles('src/data/tours.js') }}-${{ vars.NARRATION_VOICE }}-${{ github.run_id }}

      # Says out loud what the visitor will actually get, on the run summary
      # rather than buried in a log. Silence is the failure mode here, and
      # silence is exactly what nobody notices in CI.
      - name: Narration status
        run: |
          n=$(ls public/narration/*.mp3 2>/dev/null | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "::notice title=Narration::$n recorded clips in this build."
          else
            echo "::warning title=No recorded narration::This build ships no recorded narration — the tour will use the browser's own voice. Nothing was restored from the cache and no render was requested."
          fi

      - name: Build
        env:
          # A project page lives under /<repo>/. Reading it from the event
          # keeps the path right if the repository is ever renamed or forked.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Requires Pages to have been switched on once, by hand:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # The action can create the site itself via `enablement: true`, but the
      # workflow's own GITHUB_TOKEN is not permitted to create one — it fails
      # with "Resource not accessible by integration". Creating a Pages site
      # is an administrative act, and a repository token deliberately cannot
      # perform it. Every run after that first switch is fully automatic.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
